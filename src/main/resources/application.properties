spring.application.name=moni
jwt.secret=${JWT_SECRET:dev-only-insecure-secret}
aws.url=${AWS_URL:http://localhost:4566}
aws.region=${AWS_REGION:eu-central-1}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:dummy}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:dummy}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# Force IPv4 for Android emulator compatibility
server.address=0.0.0.0
# Ensure verification codes are always visible in logs
logging.level.moni.verification.VerificationCodeService=INFO