spring.application.name=personalFinance
# JWT secret is injected at runtime from HA add-on options via run.sh
jwt.secret=${JWT_SECRET:change-me-default}
# LocalStack add-on is reachable inside HA via its slug hostname
aws.url=${AWS_URL:http://localhost:4566}
aws.region=eu-central-1
aws.accessKeyId=${AWS_ACCESS_KEY_ID:dummy}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:dummy}
# Force IPv4 for Android emulator compatibility
server.address=0.0.0.0
